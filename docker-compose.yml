name: zhenhuan-monopoly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhenhuan
      POSTGRES_PASSWORD: zhenhuan
      POSTGRES_DB: zhenhuan
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zhenhuan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhenhuan"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run db:migrate && npm run db:seed && npm run build -w @zhenhuan/api && npm run start -w @zhenhuan/api"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://zhenhuan:zhenhuan@postgres:5432/zhenhuan?schema=public"
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run dev -w @zhenhuan/web"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
      NEXT_ALLOWED_DEV_ORIGINS: "${NEXT_ALLOWED_DEV_ORIGINS:-}"
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    depends_on: [api]
volumes:
  zhenhuan_data:
  api_node_modules:
  web_node_modules:
