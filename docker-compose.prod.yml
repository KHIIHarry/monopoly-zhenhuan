name: zhenhuan-monopoly

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  migrate:
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    command: ["sh", "-c", "npm run db:migrate && node packages/database/dist/seed.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:?BOOTSTRAP_ADMIN_DISPLAY_NAME is required}
      SUPER_ADMIN_USERNAMES: ${SUPER_ADMIN_USERNAMES:?SUPER_ADMIN_USERNAMES is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    environment:
      API_PORT: "4000"
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
      SUPER_ADMIN_USERNAMES: ${SUPER_ADMIN_USERNAMES:?SUPER_ADMIN_USERNAMES is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["4000"]
    networks: [backend]
    restart: unless-stopped
    deploy:
      replicas: 1

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      api:
        condition: service_started
    expose: ["3000"]
    networks: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  postgres_data:
